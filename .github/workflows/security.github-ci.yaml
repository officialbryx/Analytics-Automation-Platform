name: Security & Code Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # -------------------------------------------------------------
  # 1. Secret Detection
  # -------------------------------------------------------------
  secret_detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed to detect secrets across commits

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog-actions-scan@v3.82.6
        with:
          extra_args: --only-verified

  # -------------------------------------------------------------
  # 2. SAST (Static Application Security Testing) & SCA
  # -------------------------------------------------------------
  sast_and_sca:
    name: SAST & Dependency SCA Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default

  # -------------------------------------------------------------
  # 3. SonarQube Code Quality & Security Check
  # -------------------------------------------------------------
  sonarqube_check:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # -------------------------------------------------------------
  # 4. Container Scanning
  # -------------------------------------------------------------
  container_scanning:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build local Docker image for scanning
        run: |
          docker build -t aap-local-image:latest .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'aap-local-image:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'