name: Security & Vulnerability Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # 1. Secret Leak Detection (No Tokens Needed)
  # -------------------------------------------------------------
  secret-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Scans complete commit history

      - name: Run TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # -------------------------------------------------------------
  # 2. Dependency & Code Vulnerability Scan (Replaces SonarQube / SAST)
  # -------------------------------------------------------------
  code-and-dependency-scan:
    name: Code & Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    continue-on-error: true # Captures findings without blocking local dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Trivy Scanner on Repository
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # -------------------------------------------------------------
  # 3. Container Vulnerability Scan
  # -------------------------------------------------------------
  container-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Local Image for Scanning
        run: |
          docker build -t app-local-scan:latest .

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app-local-scan:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'