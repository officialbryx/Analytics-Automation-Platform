name: CD Pipeline Trigger

# Trigger when code is pushed or merged directly into the main branch
on:
  push:
    branches:
      - main

jobs:
  # Job 1: Run Security & Vulnerability Scan
  container_scanning:
    name: Container Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Container Scan
        run: |
          echo "Running security scan on container image..."
          # Replace this echo with your actual scanner command when ready
          # (e.g., trivy image or docker scan)

  # Job 2: Send Webhook/API Request to External CD System
  cd_pipeline_trigger:
    name: Trigger External CD System
    needs: container_scanning  # Waits for the scan to finish first
    runs-on: ubuntu-latest
    continue-on-error: true     # Won't fail the pipeline if the external webhook is down

    steps:
      - name: Notify External CD Server
        env:
          # Store your real webhook URL in GitHub: Settings > Secrets and variables > Actions
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          echo "Triggering external deployment system..."
          
          # Sends a simple HTTP POST request to your CD system
          curl -X POST "${DEPLOY_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d '{"event": "push", "branch": "main", "status": "approved"}'